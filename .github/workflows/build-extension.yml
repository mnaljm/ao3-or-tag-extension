name: Build Extension

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Copy extension files for Chrome
      run: |
        mkdir -p build/chrome
        cp manifest.json build/chrome/
        cp content.js build/chrome/
        cp utils.js build/chrome/
        cp ui.js build/chrome/
        cp options.html build/chrome/
        cp options.js build/chrome/
        cp options.css build/chrome/
    
    - name: Create Firefox manifest
      run: |
        mkdir -p build/firefox
        # Copy all files
        cp content.js build/firefox/
        cp utils.js build/firefox/
        cp ui.js build/firefox/
        cp options.html build/firefox/
        cp options.js build/firefox/
        cp options.css build/firefox/
        # Convert manifest for Firefox
        node scripts/convert-manifest-firefox.js
    
    - name: Package Chrome extension
      run: |
        cd build/chrome
        zip -r ../ao3-or-tag-chrome.zip .
        cd ../..
    
    - name: Package Firefox extension
      run: |
        cd build/firefox
        zip -r ../ao3-or-tag-firefox.zip .
        cd ../..
    
    - name: Upload Chrome artifact
      uses: actions/upload-artifact@v4
      with:
        name: ao3-or-tag-chrome
        path: build/ao3-or-tag-chrome.zip
    
    - name: Upload Firefox artifact
      uses: actions/upload-artifact@v4
      with:
        name: ao3-or-tag-firefox
        path: build/ao3-or-tag-firefox.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/ao3-or-tag-chrome.zip
          build/ao3-or-tag-firefox.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
